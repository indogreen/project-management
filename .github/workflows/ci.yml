name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel 13 / PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl, zip
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan jwt:secret --force --ansi
          php artisan config:clear --ansi

      - name: Run Backend Tests
        run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          JWT_SECRET: testing_secret_key_for_jwt_auth_testing_minimum_32_chars
          JWT_ALGO: HS256

  frontend:
    name: Frontend (SvelteKit 5 / Vite 7)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare Frontend Environment
        run: cp .env.example .env

      - name: Install NPM Dependencies
        run: npm ci

      - name: Code Style & Lint Check
        run: npm run lint

      - name: SvelteKit Diagnostics & Typecheck
        run: npm run check

      - name: Install Playwright Browsers for Component Tests
        run: npx playwright install --with-deps chromium

      - name: Run Unit & Component Tests
        run: npm run test

      - name: Build Production Bundle
        run: npm run build
